<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>🎯 Tap the Circle!</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Arial', sans-serif; color: white; overflow: hidden; user-select: none; -webkit-user-select: none; } h1 { font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.3); } #score-board { display: flex; gap: 30px; margin-bottom: 15px; font-size: 18px; } #score-board span { background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(10px); } #game-area { width: 90vw; max-width: 400px; height: 60vh; max-height: 500px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 20px; position: relative; overflow: hidden; touch-action: manipulation; } .circle { width: 60px; height: 60px; border-radius: 50%; position: absolute; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; animation: popIn 0.3s ease-out; box-shadow: 0 0 20px rgba(255,255,255,0.3); transition: transform 0.1s; } .circle:active { transform: scale(0.8); } @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } } @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } } .pop-out { animation: popOut 0.2s ease-in forwards; } #start-btn { margin-top: 20px; padding: 14px 40px; font-size: 20px; border: none; border-radius: 30px; background: linear-gradient(45deg, #e94560, #c23152); color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(233,69,96,0.4); transition: all 0.3s; } #start-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(233,69,96,0.4); } #message { margin-top: 15px; font-size: 16px; opacity: 0.8; text-align: center; min-height: 24px; } .score-pop { position: absolute; font-size: 24px; font-weight: bold; color: #00ff88; pointer-events: none; animation: floatUp 0.8s ease-out forwards; } @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } } #combo { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 20px rgba(255,200,0,0.8); color: #ffd700; } #combo.show { opacity: 1; animation: comboPop 0.5s ease-out; } @keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(0.5); } 50% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } } </style> </head> <body> <h1>🎯 Tap the Circle!</h1> <div id="score-board"> <span>⭐ Skor: <b id="score">0</b></span> <span>⏱️ Waktu: <b id="timer">30</b>s</span> </div> <div id="game-area"></div> <button id="start-btn" onclick="startGame()">▶️ MULAI</button> <p id="message">Tap lingkaran secepat mungkin!</p> <div id="combo"></div> <script> let score = 0; let timeLeft = 30; let gameInterval; let timerInterval; let isPlaying = false; let comboCount = 0; let lastTapTime = 0; const gameArea = document.getElementById('game-area'); const scoreDisplay = document.getElementById('score'); const timerDisplay = document.getElementById('timer'); const startBtn = document.getElementById('start-btn'); const message = document.getElementById('message'); const comboDisplay = document.getElementById('combo'); const circleTypes = [ { emoji: '🔴', points: 1, color: 'rgba(231,76,60,0.8)', size: 60 }, { emoji: '🟡', points: 2, color: 'rgba(241,196,15,0.8)', size: 50 }, { emoji: '🟢', points: 3, color: 'rgba(46,204,113,0.8)', size: 45 }, { emoji: '⭐', points: 5, color: 'rgba(155,89,182,0.8)', size: 40 }, { emoji: '💎', points: 10, color: 'rgba(52,152,219,0.8)', size: 35 }, ]; function getRandomType() { const rand = Math.random(); if (rand < 0.40) return circleTypes[0]; // 🔴 40% if (rand < 0.70) return circleTypes[1]; // 🟡 30% if (rand < 0.88) return circleTypes[2]; // 🟢 18% if (rand < 0.96) return circleTypes[3]; // ⭐ 8% return circleTypes[4]; // 💎 4% } function spawnCircle() { const type = getRandomType(); const circle = document.createElement('div'); circle.classList.add('circle'); const maxX = gameArea.clientWidth - type.size; const maxY = gameArea.clientHeight - type.size; const x = Math.random() * maxX; const y = Math.random() * maxY; circle.style.left = x + 'px'; circle.style.top = y + 'px'; circle.style.width = type.size + 'px'; circle.style.height = type.size + 'px'; circle.style.background = type.color; circle.textContent = type.emoji; circle.dataset.points = type.points; circle.addEventListener('touchstart', function(e) { e.preventDefault(); tapCircle(this, type); }); circle.addEventListener('click', function(e) { tapCircle(this, type); }); gameArea.appendChild(circle); // Auto remove after random time const lifeTime = 1500 + Math.random() * 2000; setTimeout(() => { if (circle.parentNode) { circle.classList.add('pop-out'); setTimeout(() => circle.remove(), 200); } }, lifeTime); } function tapCircle(circle, type) { if (!isPlaying) return; const now = Date.now(); if (now - lastTapTime < 500) { comboCount++; } else { comboCount = 1; } lastTapTime = now; let points = type.points; if (comboCount >= 5) { points *= 3; showCombo('🔥 x3!'); } else if (comboCount >= 3) { points *= 2; showCombo('⚡ x2!'); } score += points; scoreDisplay.textContent = score; // Score pop effect const pop = document.createElement('div'); pop.classList.add('score-pop'); pop.textContent = '+' + points; pop.style.left = circle.style.left; pop.style.top = circle.style.top; gameArea.appendChild(pop); setTimeout(() => pop.remove(), 800); circle.classList.add('pop-out'); setTimeout(() => circle.remove(), 200); // Vibrate if (navigator.vibrate) navigator.vibrate(30); } function showCombo(text) { comboDisplay.textContent = text; comboDisplay.classList.remove('show'); void comboDisplay.offsetWidth; comboDisplay.classList.add('show'); setTimeout(() => comboDisplay.classList.remove('show'), 800); } function startGame() { if (isPlaying) return; // Reset score = 0; timeLeft = 30; comboCount = 0; scoreDisplay.textContent = '0'; timerDisplay.textContent = '30'; gameArea.innerHTML = ''; message.textContent = 'Ayo tap! 🎯'; startBtn.style.display = 'none'; isPlaying = true; // Spawn circles spawnCircle(); gameInterval = setInterval(() => { const currentCircles = gameArea.querySelectorAll('.circle').length; const maxCircles = timeLeft < 10 ? 5 : 3; if (currentCircles < maxCircles) { spawnCircle(); } }, 600); // Timer timerInterval = setInterval(() => { timeLeft--; timerDisplay.textContent = timeLeft; if (timeLeft <= 0) { endGame(); } }, 1000); } function endGame() { isPlaying = false; clearInterval(gameInterval); clearInterval(timerInterval); gameArea.innerHTML = ''; let grade = '🥉 Pemula'; if (score >= 200) grade = '👑 LEGENDA!'; else if (score >= 150) grade = '🏆 Master!'; else if (score >= 100) grade = '🥇 Hebat!'; else if (score >= 50) grade = '🥈 Bagus!'; message.innerHTML = ` 🎉 Game Selesai!<br> Skor Akhir: <b>${score}</b><br> ${grade} `; startBtn.textContent = '🔄 MAIN LAGI'; startBtn.style.display = 'block'; } </script> </body> </html>https://USERNAME.github.io/game-saya/
